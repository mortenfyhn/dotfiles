version: v1.0
name: Dotfiles

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 5

auto_cancel:
  queued:
    when: true

blocks:
  - name: "Ubuntu 24.04"
    dependencies: []
    task:
      prologue:
        commands:
          - docker run --detach --name box -e CI -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 sleep infinity
          - docker exec box bash -c 'apt-get -qq update && apt-get -qq install sudo wget fontconfig'
      jobs:
        - name: "Install and check"
          commands: &install
            # Install the same way I would, from GitHub without cloning first
            - docker exec box bash -c "bash <(wget -qO- https://raw.githubusercontent.com/mortenfyhn/dotfiles/$SEMAPHORE_GIT_SHA/.dotfiles-install.sh)"
            - docker exec box git --git-dir=/root/.dotfiles --work-tree=/root checkout --force $SEMAPHORE_GIT_SHA
            - docker exec box zsh -i -c '~/.dotfiles-install.sh'
            - docker exec box /root/.dotfiles-check.sh

  - name: "Fedora 44"
    dependencies: []
    task:
      prologue:
        commands:
          - docker run --detach --name box -e CI fedora:44 sleep infinity
          - docker exec box dnf -yq install sudo wget fontconfig
      jobs:
        - name: "Install and check"
          commands: *install
