version: v1.0
name: Dotfiles

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 5

auto_cancel:
  queued:
    when: true

blocks:
  - name: "Checks"
    task:
      jobs:
      - name: "Install"
        commands:
          # Install the same way I would, from GitHub without cloning first
          - bash <(wget -qO- -o /dev/null https://raw.githubusercontent.com/mortenfyhn/dotfiles/${SEMAPHORE_GIT_SHA}/.dotfiles-install.sh)
          # Try sourcing .zshrc succeeds (`zsh -i` does so)
          # and re-run the install script in ZSH to test idempotency
          - echo 'echo "Sourced .zshrc"' >> ~/.zshrc
          - zsh -i -c './.dotfiles-install.sh'

      # Runs .dotfiles-check.sh rather than repeating the checks here, so this
      # job and a local pre-push run can't disagree
      - name: "Checks"
        commands:
          - checkout
            # Apparently shellcheck is pre-installed
          - shellcheck --version
          - wget https://github.com/patrickvane/shfmt/releases/download/master/shfmt_linux_amd64 -O shfmt
          - chmod +x shfmt
          - sudo mv shfmt /usr/local/bin/
          - shfmt --version
          - ./.dotfiles-check.sh
